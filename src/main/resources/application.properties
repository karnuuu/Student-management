# ---------- Application ----------
spring.application.name=student-management
server.port=8080

# ---------- MySQL (CHANGE USERNAME AND PASSWORD) ----------
spring.datasource.url=jdbc:mysql://localhost:3306/student_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=YOUR_USERNAME
spring.datasource.password=YOUR_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
# "update" creates/updates the tables automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- JWT ----------
# Secret must be at least 32 characters long. Change it to your own text.
jwt.secret=ChangeThisSecretKeyToYourOwnLongRandomText_AtLeast32Characters_12345
# Token validity: 1 hour (in milliseconds)
jwt.expiration-ms=3600000
